name: Gmail Scan Pipeline

on:
  schedule:
    - cron: '0 */2 * * *'          # every 2 hours — a household inbox has far lower volume/urgency than Distilled's hourly content pipeline
  workflow_dispatch:                # manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Gmail scan
        # Config lives in repo settings (Settings -> Secrets and variables -> Actions):
        #   variable APP_URL   = https://family-chief-of-staff.vercel.app
        #   secret   CRON_SECRET = must match the CRON_SECRET env var on Vercel
        # The route caps how many new messages it processes per call, so a
        # backlog drains over several runs rather than timing out in one.
        run: |
          curl -f -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ vars.APP_URL }}/api/pipeline/gmail-scan"
